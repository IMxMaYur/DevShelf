<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text-to-Speech App</title>
  <meta name="description" content="A premium text-to-speech app with voice controls, built with HTML, CSS, and JavaScript." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-waves">
    <div class="wave wave-1"></div>
    <div class="wave wave-2"></div>
    <div class="wave wave-3"></div>
  </div>

  <main class="container">
    <header class="header">
      <div class="logo-wrap">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
        <h1 class="app-title">VoiceIt</h1>
      </div>
      <p class="subtitle">Transform text into natural speech</p>
    </header>

    <div class="card">
      <div class="textarea-wrap">
        <textarea id="text-input" class="text-input" placeholder="Type or paste your text here…" maxlength="5000" rows="6"></textarea>
        <div class="char-counter"><span id="char-count">0</span>/5000</div>
      </div>

      <div class="presets">
        <button class="preset-btn" data-text="Hello! Welcome to the VoiceIt text-to-speech application.">👋 Welcome</button>
        <button class="preset-btn" data-text="The quick brown fox jumps over the lazy dog.">🦊 Pangram</button>
        <button class="preset-btn" data-text="To be, or not to be, that is the question. Whether 'tis nobler in the mind to suffer the slings and arrows of outrageous fortune.">📖 Shakespeare</button>
      </div>

      <div class="voice-controls">
        <div class="control-group">
          <label class="control-label" for="voice-select">Voice</label>
          <select id="voice-select" class="voice-select"></select>
        </div>
        <div class="control-group">
          <label class="control-label" for="rate-slider">Speed <span id="rate-val" class="slider-val">1.0×</span></label>
          <input id="rate-slider" class="slider" type="range" min="0.5" max="2" step="0.1" value="1" />
        </div>
        <div class="control-group">
          <label class="control-label" for="pitch-slider">Pitch <span id="pitch-val" class="slider-val">1.0</span></label>
          <input id="pitch-slider" class="slider" type="range" min="0" max="2" step="0.1" value="1" />
        </div>
        <div class="control-group">
          <label class="control-label" for="volume-slider">Volume <span id="volume-val" class="slider-val">100%</span></label>
          <input id="volume-slider" class="slider" type="range" min="0" max="1" step="0.05" value="1" />
        </div>
      </div>

      <div class="visualizer" id="visualizer">
        <div class="vis-bar" id="bar-1"></div>
        <div class="vis-bar" id="bar-2"></div>
        <div class="vis-bar" id="bar-3"></div>
        <div class="vis-bar" id="bar-4"></div>
        <div class="vis-bar" id="bar-5"></div>
        <div class="vis-bar" id="bar-6"></div>
        <div class="vis-bar" id="bar-7"></div>
        <div class="vis-bar" id="bar-8"></div>
        <div class="vis-bar" id="bar-9"></div>
      </div>

      <div class="playback-controls">
        <button id="btn-stop" class="ctrl-btn btn-stop" aria-label="Stop" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        </button>
        <button id="btn-play" class="ctrl-btn btn-play" aria-label="Speak">
          <svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26"><path d="M5 3l14 9-14 9V3z"/></svg>
        </button>
        <button id="btn-pause" class="ctrl-btn btn-pause" aria-label="Pause" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
      </div>

      <div id="status-msg" class="status-msg">Ready to speak</div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
