<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter App</title>
  <meta name="description" content="A sleek, interactive counter app built with HTML, CSS, and JavaScript." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="container">
    <h1 class="title">Counter</h1>
    <p class="subtitle">Track your numbers with style</p>

    <div class="card">
      <div class="display">
        <div id="counter-value" class="counter-value">0</div>
        <div id="counter-label" class="counter-label">Current Count</div>
      </div>

      <div class="progress-ring-wrap">
        <svg class="progress-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52" />
          <circle id="progress-arc" class="ring-fill" cx="60" cy="60" r="52" />
        </svg>
        <span id="ring-pct" class="ring-pct">0%</span>
      </div>

      <div class="controls">
        <button id="btn-decrement" class="btn btn-decrement" aria-label="Decrement">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button id="btn-reset" class="btn btn-reset" aria-label="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button id="btn-increment" class="btn btn-increment" aria-label="Increment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>

      <div class="step-wrap">
        <label for="step-input" class="step-label">Step Size</label>
        <input id="step-input" class="step-input" type="number" value="1" min="1" max="100" />
      </div>

      <div class="history">
        <h2 class="history-title">History</h2>
        <ul id="history-list" class="history-list"></ul>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
