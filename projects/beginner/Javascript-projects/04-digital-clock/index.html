<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Clock</title>
  <meta name="description" content="A real-time digital clock with live sky simulation — sun, moon, stars and dynamic sky." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════ Dynamic Sky Scene (fixed, full-screen) ═══════════ -->
  <div class="sky-scene" id="sky-scene">

    <!-- Stars (generated by JS) -->
    <div class="stars-layer" id="stars-layer"></div>

    <!-- Horizon atmospheric glow band (sunrise / sunset) -->
    <div class="horizon-glow" id="horizon-glow"></div>

    <!-- Sun: 0×0 container, children radiate from its centre -->
    <div class="celestial sun-wrap" id="sun-wrap">
      <div class="sun-outer-glow" id="sun-outer-glow"></div>
      <div class="sun-rays"       id="sun-rays"></div>
      <div class="sun-body"       id="sun-body"></div>
    </div>

    <!-- Moon: same 0×0 trick -->
    <div class="celestial moon-wrap" id="moon-wrap">
      <div class="moon-halo"></div>
      <div class="moon-body">
        <div class="crater c1"></div>
        <div class="crater c2"></div>
        <div class="crater c3"></div>
      </div>
    </div>

    <!-- Clouds (3 layers at different speeds & heights) -->
    <div class="cloud" id="cloud-a" style="--dur:88s;  --del:-15s; --top:9%;  --w:140px; --h:44px;"></div>
    <div class="cloud" id="cloud-b" style="--dur:128s; --del:-55s; --top:19%; --w:95px;  --h:32px;"></div>
    <div class="cloud" id="cloud-c" style="--dur:68s;  --del:-35s; --top:6%;  --w:175px; --h:52px;"></div>

    <!-- Ground silhouette at bottom -->
    <div class="ground" id="ground"></div>
  </div>
  <!-- ════════════════════════════════════════════════════════════ -->


  <!-- Clock UI -->
  <main class="container">
    <div class="clock-card" id="clock-card">

      <div class="clock-header">
        <div id="greeting" class="greeting">Good Morning</div>
        <div id="date-display" class="date-display"></div>
      </div>

      <div class="time-display">
        <div class="time-block">
          <div id="hours" class="time-digit">00</div>
          <div class="time-unit">HRS</div>
        </div>
        <div class="time-separator"><span class="colon" id="colon1">:</span></div>
        <div class="time-block">
          <div id="minutes" class="time-digit">00</div>
          <div class="time-unit">MIN</div>
        </div>
        <div class="time-separator"><span class="colon" id="colon2">:</span></div>
        <div class="time-block">
          <div id="seconds" class="time-digit">00</div>
          <div class="time-unit">SEC</div>
        </div>
        <div class="ampm-block">
          <div id="ampm" class="ampm">AM</div>
        </div>
      </div>

      <div class="progress-row">
        <div class="progress-item">
          <span class="progress-label">Day Progress</span>
          <div class="progress-track"><div id="day-progress" class="progress-fill fill-day"></div></div>
        </div>
        <div class="progress-item">
          <span class="progress-label">Year Progress</span>
          <div class="progress-track"><div id="year-progress" class="progress-fill fill-year"></div></div>
        </div>
      </div>

      <div class="timezone-row">
        <button class="tz-btn active" id="btn-12h" onclick="toggleFormat(12)">12h</button>
        <button class="tz-btn"        id="btn-24h" onclick="toggleFormat(24)">24h</button>
        <div id="timezone-label" class="timezone-label"></div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
